spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}
  kafka:
    # Defaults to an address nothing is listening on, rather than leaving this
    # unset — Spring fails app *startup* entirely if a referenced env var has no
    # fallback and isn't provided. With the default, a deploy that skips Kafka
    # simply never gets a broker to talk to: click events fail to publish (logged,
    # non-fatal, handled off the request thread — see ClickEventProducer) and the
    # two @KafkaListener consumers retry quietly in the background. Redirects and
    # every other endpoint are unaffected either way.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
  lifecycle:
    timeout-per-shutdown-phase: 25s

app:
  base-url: ${APP_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}

server:
  forward-headers-strategy: native   # trust X-Forwarded-* from the LB / ingress
  shutdown: graceful

logging:
  level:
    root: WARN
    com.urlshortener: INFO
