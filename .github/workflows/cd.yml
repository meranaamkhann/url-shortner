name: CD

# Deploys only on a successful merge to main, after CI has already passed
# (CI runs on the same push event; CD additionally requires environment
# approval gates configured in GitHub's Environments settings for "production").
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # The default 'docker' driver on GitHub-hosted runners can't export
        # build cache to GitHub Actions cache (cache-to: type=gha below) —
        # only the docker-container driver this action switches to supports it.

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Deployment currently happens on Railway (see the app's Railway project
# settings), not against a Kubernetes cluster — so the deploy-staging /
# deploy-production jobs that used to live here (kubectl apply against
# KUBE_CONFIG_STAGING / KUBE_CONFIG_PROD secrets that were never configured)
# have been removed rather than left failing on every push. The k8s/
# manifests are still in the repo and still valid; wire equivalent jobs back
# in here (with real kubeconfig secrets set in repo Settings -> Secrets) if
# this ever moves onto a real k8s cluster.